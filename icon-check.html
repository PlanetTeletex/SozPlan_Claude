<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Symbol-Prüfung</title>
<style>
:root{--paper:#e9e1d0;--surface:#f4efe3;--ink:#2b2320;--soft:#6d5f52;--faint:#8e8271;
      --maroon:#7a1f2b;--gold:#a9801f;--rule:#cdc1a8;--ok:#2f6b3a;--bad:#a32020;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#131923;--surface:#1a212e;--ink:#e8ddc7;
  --soft:#a99d89;--faint:#8b8272;--maroon:#d4838c;--gold:#d3a53a;--rule:#33405a;
  --ok:#7fc08c;--bad:#e58b8b;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);padding:1.1rem 1rem 4rem;
  font:15px/1.5 system-ui,-apple-system,sans-serif}
h1{font-size:1.25rem;margin:0 0 .2rem;color:var(--maroon)}
p.lede{color:var(--soft);margin:0 0 1.3rem;font-size:.9rem}
h2{font-size:1rem;margin:1.6rem 0 .5rem;padding-top:.9rem;border-top:1px solid var(--rule)}
.row{display:flex;gap:.55rem;align-items:baseline;padding:.3rem 0;
     border-bottom:1px solid var(--rule);font-size:.86rem;flex-wrap:wrap}
.row .k{flex:1;min-width:9rem;word-break:break-all}
.row .v{color:var(--soft);text-align:right;word-break:break-all}
.ok{color:var(--ok);font-weight:600}
.bad{color:var(--bad);font-weight:600}
.env{background:var(--surface);border:1px solid var(--rule);border-radius:8px;
     padding:.6rem .8rem;font-size:.8rem;color:var(--soft);word-break:break-all;margin:0 0 .5rem}
.shots{display:flex;gap:.7rem;flex-wrap:wrap;margin:.7rem 0 .2rem}
.shots figure{margin:0;text-align:center;font-size:.7rem;color:var(--faint)}
.shots img{width:62px;height:62px;display:block;background:var(--surface);
           border:1px solid var(--rule);border-radius:10px;object-fit:contain}
.verdict{margin:.7rem 0 0;padding:.6rem .8rem;border-radius:8px;font-size:.88rem;
         background:var(--surface);border-left:4px solid var(--gold)}
button{font:inherit;background:var(--maroon);color:var(--paper);border:0;
       border-radius:999px;padding:.4rem 1.1rem;margin-top:1.4rem}
code{font-size:.82em;background:var(--surface);padding:.05em .3em;border-radius:3px}
</style>
</head>
<body>
<h1>Symbol-Prüfung</h1>
<p class="lede">Was dein Browser bei Lojong und Pecha tatsächlich vorfindet. Mach einen
Screenshot von dieser Seite, falls etwas rot ist.</p>

<div class="env" id="env">…</div>
<div id="out"></div>
<button id="again" type="button">Noch einmal messen</button>

<script>
const APPS = ["lojong", "pecha"];
const out = document.getElementById("out");

function row(parent, key, value, state){
  const d = document.createElement("div");
  d.className = "row";
  const k = document.createElement("span"); k.className = "k"; k.textContent = key;
  const v = document.createElement("span");
  v.className = "v" + (state === true ? " ok" : state === false ? " bad" : "");
  v.textContent = value;
  d.append(k, v);
  parent.appendChild(d);
  return state;
}

/* real pixel size, which only decoding can tell us */
function decode(url){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => res({ ok:true, w:img.naturalWidth, h:img.naturalHeight });
    img.onerror = () => res({ ok:false });
    img.src = url + "?t=" + Date.now();
  });
}

async function head(url){
  try {
    const r = await fetch(url, { cache:"no-store" });
    const buf = r.ok ? await r.arrayBuffer() : null;
    return { status:r.status, type:r.headers.get("content-type") || "—",
             bytes: buf ? buf.byteLength : 0 };
  } catch (e){
    return { status:0, type:"Netzfehler: " + e.message, bytes:0 };
  }
}

async function checkApp(app){
  const sec = document.createElement("section");
  const h = document.createElement("h2"); h.textContent = app;
  sec.appendChild(h);
  out.appendChild(sec);

  let trouble = [];

  // the manifest itself
  const murl = `./${app}/manifest.json`;
  const m = await head(murl);
  row(sec, "manifest.json", m.status || "kein Zugriff", m.status === 200);
  if (m.status !== 200) trouble.push("Das Manifest wird nicht ausgeliefert.");
  row(sec, "  Content-Type", m.type, /json/i.test(m.type));
  if (m.status === 200 && !/json/i.test(m.type))
    trouble.push("Das Manifest kommt mit einem falschen Content-Type an.");

  let man = null;
  if (m.status === 200){
    try { man = await (await fetch(murl, { cache:"no-store" })).json(); }
    catch (e){ trouble.push("Das Manifest ist kein gültiges JSON."); }
    row(sec, "  JSON lesbar", man ? "ja" : "nein", !!man);
  }

  if (man){
    const base = new URL(murl, location.href);
    row(sec, "  short_name", man.short_name || "— fehlt —", !!man.short_name);
    row(sec, "  start_url →", new URL(man.start_url || ".", base).pathname, true);
    row(sec, "  id", man.id === undefined
        ? "nicht gesetzt (= start_url, richtig)"
        : new URL(man.id, location.origin).href, man.id === undefined);
    if (man.id !== undefined) trouble.push("Das Manifest setzt eine eigene id.");

    const shots = document.createElement("div");
    shots.className = "shots";
    let usable = 0;
    for (const ic of man.icons || []){
      const u = new URL(ic.src, base).href;
      const f = await head(u);
      const d = await decode(u);
      const good = f.status === 200 && d.ok;
      if (good && /png/i.test(f.type)) usable++;
      row(sec, `  ${ic.src} (${ic.purpose})`,
          good ? `${d.w}×${d.h}, ${f.type}, ${(f.bytes/1024).toFixed(1)} kB`
               : `HTTP ${f.status}, nicht lesbar`, good);
      if (good){
        const fig = document.createElement("figure");
        const img = document.createElement("img");
        img.src = u; img.alt = ic.src;
        const cap = document.createElement("figcaption");
        cap.textContent = ic.sizes + (ic.purpose === "maskable" ? " M" : "");
        fig.append(img, cap);
        shots.appendChild(fig);
      }
    }
    sec.appendChild(shots);
    if (!usable) trouble.push("Kein einziges PNG-Symbol aus dem Manifest ist ladbar.");
  }

  // the icon iOS uses, which never comes from the manifest
  const a = await head(`./${app}/apple-touch-icon.png`);
  const ad = await decode(`./${app}/apple-touch-icon.png`);
  row(sec, "apple-touch-icon.png",
      a.status === 200 && ad.ok ? `${ad.w}×${ad.h}, ${a.type}` : `HTTP ${a.status}`,
      a.status === 200 && ad.ok);
  if (!(a.status === 200 && ad.ok)) trouble.push("Das iOS-Symbol fehlt.");

  const v = document.createElement("div");
  v.className = "verdict";
  v.textContent = trouble.length
      ? "Gefunden: " + trouble.join(" ")
      : "Alles in Ordnung — Manifest, Symbole und das iOS-Symbol kommen sauber an. "
        + "Zeigt der Homescreen trotzdem einen Buchstaben, liegt es am alten "
        + "Eintrag: löschen und neu ablegen.";
  sec.appendChild(v);
}

async function run(){
  out.textContent = "";
  const standalone = matchMedia("(display-mode: standalone)").matches;
  document.getElementById("env").textContent =
    `${navigator.userAgent}\n\nals App gestartet: ${standalone ? "ja" : "nein"}`
    + `\nService Worker: ${"serviceWorker" in navigator ? "unterstützt" : "nein"}`
    + `\nSeite: ${location.href}`;
  for (const app of APPS) await checkApp(app);
}
document.getElementById("again").addEventListener("click", run);
run();
</script>
</body>
</html>
